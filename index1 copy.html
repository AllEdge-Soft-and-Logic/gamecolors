<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>🎨 Coloring App Pro</title>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <style>
        :root {
            --primary: #007bff;
            --toolbar-h: 80px;
            --gallery-h: 100px;
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --safe-top: env(safe-area-inset-top, 0px);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f5f6fa;
            overflow: hidden;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            -webkit-text-size-adjust: 100%;
        }

        /* ---------- Header ---------- */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: calc(50px + var(--safe-top));
            padding-top: var(--safe-top);
            background: var(--primary);
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            z-index: 20;
        }

        /* ---------- Canvas ---------- */
        .canvas-container {
            position: fixed;
            top: calc(50px + var(--safe-top));
            bottom: calc(var(--toolbar-h) + var(--safe-bottom));
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body.gallery-open .canvas-container {
            bottom: calc(var(--toolbar-h) + var(--gallery-h) + var(--safe-bottom));
        }

        canvas {
            display: block;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 6px 25px rgba(0, 0, 0, .2);
            touch-action: none;
            /* required for pointer drawing */
        }

        /* ---------- Toolbar ---------- */
        .toolbar {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: calc(var(--toolbar-h) + var(--safe-bottom));
            padding: 0 6px var(--safe-bottom);
            display: flex;
            align-items: center;
            gap: 2px;
            background: #fff;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, .15);
            border-radius: 20px 20px 0 0;
            z-index: 30;
        }

        .tool-btn {
            flex: 1 1 0;
            min-width: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            padding: 6px 0;
            border: 0;
            background: none;
            font: inherit;
            font-size: 10px;
            line-height: 1.1;
            white-space: nowrap;
            color: #666;
            border-radius: 12px;
            cursor: pointer;
            touch-action: manipulation;
            transition: color .2s, transform .15s;
        }

        .tool-btn span {
            font-size: 20px;
            line-height: 1;
        }

        .tool-btn.active {
            color: var(--primary);
            font-weight: 700;
        }

        .tool-btn:active {
            transform: scale(.9);
        }

        input[type="range"] {
            width: 100%;
            max-width: 52px;
            height: 18px;
            margin: 0;
            accent-color: var(--primary);
            touch-action: manipulation;
        }

        /* ---------- Floating color button ---------- */
        .color-btn {
            position: fixed;
            right: 18px;
            bottom: calc(var(--toolbar-h) + var(--safe-bottom) + 22px);
            width: 62px;
            height: 62px;
            padding: 0;
            border: 0;
            border-radius: 50%;
            font-size: 26px;
            background: #ffcc00;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 15px rgba(0, 0, 0, .3);
            cursor: pointer;
            z-index: 70;
            transition: transform .15s;
            touch-action: manipulation;
        }

        .color-btn:active {
            transform: scale(.9);
        }

        /* ---------- Palette ---------- */
        .palette-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .25);
            display: none;
            z-index: 50;
        }

        .palette-overlay.open {
            display: block;
        }

        .palette-popup {
            position: fixed;
            right: 12px;
            bottom: calc(var(--toolbar-h) + var(--safe-bottom) + 98px);
            padding: 12px;
            background: #fff;
            border-radius: 18px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, .28);
            display: none;
            z-index: 60;
        }

        .palette-popup.open {
            display: block;
            animation: pop .18s ease;
        }

        @keyframes pop {
            from {
                transform: scale(.85);
                opacity: 0;
            }

            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .colors {
            display: grid;
            grid-template-columns: repeat(6, 42px);
            gap: 8px;
        }

        .swatch {
            width: 42px;
            height: 42px;
            padding: 0;
            border: 3px solid transparent;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .08);
            transition: transform .15s, border-color .15s;
            touch-action: manipulation;
        }

        .swatch:hover {
            transform: scale(1.12);
        }

        .swatch.active {
            border-color: #333;
            transform: scale(1.08);
        }

        input[type="color"].swatch {
            -webkit-appearance: none;
            appearance: none;
            background: none;
        }

        input[type="color"].swatch::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        input[type="color"].swatch::-webkit-color-swatch {
            border: 2px dashed #bbb;
            border-radius: 50%;
        }

        /* ---------- Gallery ---------- */
        .gallery {
            position: fixed;
            left: 0;
            right: 0;
            bottom: calc(var(--toolbar-h) + var(--safe-bottom));
            height: var(--gallery-h);
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: #fff;
            overflow-x: auto;
            overflow-y: hidden;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 -2px 10px rgba(0, 0, 0, .1);
            transform: translateY(calc(100% + var(--toolbar-h) + var(--safe-bottom)));
            transition: transform .3s ease;
            z-index: 25;
        }

        .gallery.open {
            transform: translateY(0);
        }

        .gallery img {
            width: 80px;
            height: 80px;
            flex: 0 0 auto;
            object-fit: cover;
            border: 3px solid transparent;
            border-radius: 10px;
            background: #f0f0f0;
            cursor: pointer;
            transition: border-color .2s, transform .2s;
            -webkit-user-drag: none;
            user-select: none;
        }

        .gallery img.active {
            border-color: var(--primary);
            transform: scale(1.05);
        }

        /* ---------- Splash / Loader ---------- */
        #splash {
            position: fixed;
            inset: 0;
            background: var(--primary);
            color: #fff;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut 1s ease 2s forwards;
        }

        #splash .logo {
            font-size: 60px;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        #loader {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 10px 20px;
            background: #000;
            color: #fff;
            border-radius: 10px;
            display: none;
            z-index: 9999;
        }

        /* ---------- Install banner ---------- */
        .install-banner {
            position: fixed;
            bottom: calc(var(--toolbar-h) + var(--safe-bottom) + 25px);
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            padding: 12px 20px;
            background: var(--primary);
            color: #fff;
            border-radius: 30px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, .3);
            transition: transform .4s;
            z-index: 999;
        }

        .install-banner.show {
            transform: translateX(-50%) translateY(0);
        }

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                transition-duration: .01ms !important;
            }
        }
    </style>
</head>

<body>
    <div id="splash">
        <div class="logo">🎨</div>
        <h2>Coloring App</h2>
    </div>

    <div id="loader" role="status" aria-live="polite">Loading…</div>

    <header class="header">🎨 Coloring App</header>

    <main class="canvas-container">
        <canvas id="canvas" width="1200" height="900" aria-label="Coloring canvas"></canvas>
    </main>

    <div class="palette-overlay" id="paletteOverlay"></div>

    <div class="palette-popup" id="palettePopup" role="dialog" aria-label="Color palette">
        <div class="colors" id="colors"></div>
    </div>

    <button type="button" class="color-btn" id="colorBtn" aria-label="Choose color">🎨</button>

    <div class="gallery" id="gallery" aria-label="Coloring pages"></div>

    <nav class="toolbar">
        <button type="button" class="tool-btn" id="galleryBtn" data-action="gallery">
            <span>🖼️</span>Gallery
        </button>
        <div class="tool-btn">
            <span>📏</span>
            <input type="range" id="brushSize" min="1" max="20" value="4" aria-label="Brush size">
        </div>
        <button type="button" class="tool-btn" id="penBtn" data-action="pen">
            <span>🖌</span>Pen
        </button>
        <button type="button" class="tool-btn" id="bucketBtn" data-action="bucket">
            <span>🪣</span>Fill
        </button>
        <button type="button" class="tool-btn" data-action="undo">
            <span>↩</span>Undo
        </button>
        <button type="button" class="tool-btn" data-action="clear">
            <span>🧹</span>Clear
        </button>
        <button type="button" class="tool-btn" data-action="save">
            <span>⬇</span>Save
        </button>
    </nav>

    <script>
        (() => {
            'use strict';

            /* ================= Elements ================= */
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d', { willReadFrequently: true });
            const container = document.querySelector('.canvas-container');
            const galleryEl = document.getElementById('gallery');
            const palettePopup = document.getElementById('palettePopup');
            const paletteOverlay = document.getElementById('paletteOverlay');
            const colorsEl = document.getElementById('colors');
            const colorBtn = document.getElementById('colorBtn');
            const penBtn = document.getElementById('penBtn');
            const bucketBtn = document.getElementById('bucketBtn');
            const brushSizeEl = document.getElementById('brushSize');
            const loader = document.getElementById('loader');

            /* ================= Config ================= */
            const MAX_CANVAS_PIXELS = 1_200_000;   // ~1.2 MP cap
            const MAX_HISTORY_BYTES = 32 * 1024 * 1024;
            const MAX_HISTORY_ITEMS = 20;
            const FILL_TOLERANCE = 42;
            const GALLERY_COUNT = 36;

            const PALETTE = [
                '#ff0000', '#ff7f00', '#ffff00', '#00ff00', '#00ffff', '#0000ff',
                '#8b00ff', '#ff1493', '#a52a2a', '#deb887', '#ffd700', '#808000',
                '#006400', '#20b2aa', '#4682b4', '#4b0082', '#800080', '#c71585',
                '#000000', '#555555', '#aaaaaa', '#ffffff', '#ffcccb', '#ffe4b5'
            ];

            /* ================= State ================= */
            let tool = 'pen';
            let color = '#000000';
            let painting = false;
            let galleryOpen = false;
            let paletteOpen = false;
            let baseSnapshot = null;   // cleaned line art (ImageData)
            let lastX = 0;
            let lastY = 0;

            const history = [];
            let historyBytes = 0;

            /* ================= Canvas sizing ================= */
            function fitCanvasToContainer() {
                const rect = container.getBoundingClientRect();
                if (!rect.width || !rect.height) return;
                const scale = Math.min(rect.width / canvas.width, rect.height / canvas.height);
                canvas.style.width = Math.floor(canvas.width * scale) + 'px';
                canvas.style.height = Math.floor(canvas.height * scale) + 'px';
            }

            let resizeRaf = 0;
            function scheduleFit() {
                cancelAnimationFrame(resizeRaf);
                resizeRaf = requestAnimationFrame(fitCanvasToContainer);
            }

            window.addEventListener('resize', scheduleFit);
            window.addEventListener('orientationchange', () => setTimeout(fitCanvasToContainer, 250));

            /* ================= Helpers ================= */
            const hexToRgb = (hex) => {
                let h = String(hex).replace('#', '');
                if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
                const n = parseInt(h, 16);
                return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
            };

            const showLoader = (show) => { loader.style.display = show ? 'block' : 'none'; };

            /* ================= History ================= */
            function saveState() {
                const snap = ctx.getImageData(0, 0, canvas.width, canvas.height);
                history.push(snap);
                historyBytes += snap.data.byteLength;
                while (history.length > 1 &&
                    (historyBytes > MAX_HISTORY_BYTES || history.length > MAX_HISTORY_ITEMS)) {
                    historyBytes -= history.shift().data.byteLength;
                }
            }

            function resetHistory() {
                history.length = 0;
                historyBytes = 0;
            }

            function undo() {
                const prev = history.pop();
                if (!prev) return;
                historyBytes -= prev.data.byteLength;
                ctx.putImageData(prev, 0, 0);
            }

            /* ================= Tools ================= */
            function setTool(t) {
                tool = t;
                penBtn.classList.toggle('active', t === 'pen');
                bucketBtn.classList.toggle('active', t === 'bucket');
            }

            function applyBrushStyle() {
                ctx.lineWidth = Number(brushSizeEl.value) || 4;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.strokeStyle = color;
            }

            /* ================= Pointer drawing ================= */
            function getPos(e) {
                const rect = canvas.getBoundingClientRect();
                return {
                    x: (e.clientX - rect.left) * (canvas.width / rect.width),
                    y: (e.clientY - rect.top) * (canvas.height / rect.height)
                };
            }

            function onPointerDown(e) {
                if (e.pointerType === 'mouse' && e.button !== 0) return;

                if (galleryOpen) closeGallery();
                if (paletteOpen) closePalette();

                const { x, y } = getPos(e);

                if (tool === 'bucket') {
                    saveState();
                    floodFill(Math.floor(x), Math.floor(y), hexToRgb(color));
                    return;
                }

                painting = true;
                if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);

                saveState();
                applyBrushStyle();
                lastX = x;
                lastY = y;

                // dot on tap
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + 0.01, y);
                ctx.stroke();
            }

            function onPointerMove(e) {
                if (!painting) return;

                const coalesced = (typeof e.getCoalescedEvents === 'function')
                    ? e.getCoalescedEvents()
                    : null;
                const points = (coalesced && coalesced.length) ? coalesced : [e];

                ctx.beginPath();
                ctx.moveTo(lastX, lastY);
                for (let i = 0; i < points.length; i++) {
                    const p = getPos(points[i]);
                    ctx.lineTo(p.x, p.y);
                    lastX = p.x;
                    lastY = p.y;
                }
                ctx.stroke();
            }

            function onPointerUp(e) {
                if (!painting) return;
                painting = false;
                ctx.beginPath();
                if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
                    canvas.releasePointerCapture(e.pointerId);
                }
            }

            canvas.addEventListener('pointerdown', onPointerDown);
            canvas.addEventListener('pointermove', onPointerMove);
            canvas.addEventListener('pointerup', onPointerUp);
            canvas.addEventListener('pointercancel', onPointerUp);
            canvas.addEventListener('pointerleave', onPointerUp);
            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            /* ================= Flood fill (scanline) ================= */
            function floodFill(sx, sy, fillRGB) {
                const w = canvas.width;
                const h = canvas.height;
                if (sx < 0 || sy < 0 || sx >= w || sy >= h) return;

                const imgData = ctx.getImageData(0, 0, w, h);
                const data = imgData.data;

                const si = (sy * w + sx) * 4;
                const tr = data[si], tg = data[si + 1], tb = data[si + 2];
                const fr = fillRGB[0], fg = fillRGB[1], fb = fillRGB[2];

                if (tr === fr && tg === fg && tb === fb) return;

                const visited = new Uint8Array(w * h);
                const tol = FILL_TOLERANCE;

                const matches = (px, py) => {
                    const p = py * w + px;
                    if (visited[p]) return false;
                    const i = p * 4;
                    return (data[i] > tr ? data[i] - tr : tr - data[i]) <= tol &&
                        (data[i + 1] > tg ? data[i + 1] - tg : tg - data[i + 1]) <= tol &&
                        (data[i + 2] > tb ? data[i + 2] - tb : tb - data[i + 2]) <= tol;
                };

                const stack = [sx, sy];

                while (stack.length) {
                    const y = stack.pop();
                    const x = stack.pop();
                    if (!matches(x, y)) continue;

                    let left = x;
                    while (left > 0 && matches(left - 1, y)) left--;
                    let right = x;
                    while (right < w - 1 && matches(right + 1, y)) right++;

                    for (let px = left; px <= right; px++) {
                        const p = y * w + px;
                        visited[p] = 1;
                        const i = p * 4;
                        data[i] = fr;
                        data[i + 1] = fg;
                        data[i + 2] = fb;
                        data[i + 3] = 255;
                    }

                    // scan the rows above and below
                    for (let py = y - 1; py <= y + 1; py += 2) {
                        if (py < 0 || py >= h) continue;
                        let inSpan = false;
                        for (let px = left; px <= right; px++) {
                            if (matches(px, py)) {
                                if (!inSpan) { stack.push(px, py); inSpan = true; }
                            } else {
                                inSpan = false;
                            }
                        }
                    }
                }

                ctx.putImageData(imgData, 0, 0);
            }

            /* ================= Image loading ================= */
            function binarize() {
                const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const d = imgData.data;
                for (let i = 0; i < d.length; i += 4) {
                    const lum = d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114;
                    const v = lum < 150 ? 0 : 255;
                    d[i] = d[i + 1] = d[i + 2] = v;
                    d[i + 3] = 255;
                }
                ctx.putImageData(imgData, 0, 0);
            }

            function loadImage(src) {
                showLoader(true);
                const img = new Image();
                img.decoding = 'async';

                img.onload = () => {
                    let w = img.naturalWidth || canvas.width;
                    let h = img.naturalHeight || canvas.height;

                    const scale = Math.min(1, Math.sqrt(MAX_CANVAS_PIXELS / (w * h)));
                    w = Math.max(1, Math.round(w * scale));
                    h = Math.max(1, Math.round(h * scale));

                    canvas.width = w;
                    canvas.height = h;

                    ctx.imageSmoothingEnabled = true;
                    ctx.imageSmoothingQuality = 'high';

                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, w, h);
                    ctx.drawImage(img, 0, 0, w, h);

                    binarize();
                    baseSnapshot = ctx.getImageData(0, 0, w, h);
                    resetHistory();

                    fitCanvasToContainer();
                    showLoader(false);
                };

                img.onerror = () => {
                    showLoader(false);
                    console.warn('Could not load image:', src);
                };

                img.src = src;
            }

            /* ================= Clear / Save ================= */
            function clearCanvas() {
                saveState();
                if (baseSnapshot) {
                    ctx.putImageData(baseSnapshot, 0, 0);
                } else {
                    ctx.fillStyle = '#fff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }
            }

            function download() {
                const link = document.createElement('a');
                link.download = 'coloring-' + Date.now() + '.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            }

            /* ================= Palette ================= */
            function buildPalette() {
                const frag = document.createDocumentFragment();

                PALETTE.forEach((c) => {
                    const b = document.createElement('button');
                    b.type = 'button';
                    b.className = 'swatch' + (c === color ? ' active' : '');
                    b.style.background = c;
                    b.dataset.color = c;
                    b.setAttribute('aria-label', 'Color ' + c);
                    frag.appendChild(b);
                });

                const custom = document.createElement('input');
                custom.type = 'color';
                custom.className = 'swatch';
                custom.value = color;
                custom.setAttribute('aria-label', 'Custom color');
                frag.appendChild(custom);

                colorsEl.appendChild(frag);

                colorsEl.addEventListener('click', (e) => {
                    const sw = e.target.closest('.swatch');
                    if (!sw || sw.tagName === 'INPUT') return;
                    pickColor(sw.dataset.color, sw);
                });

                // live preview while picking, commit on change
                custom.addEventListener('input', () => {
                    color = custom.value;
                    colorBtn.style.background = custom.value;
                });
                custom.addEventListener('change', () => {
                    colorsEl.querySelectorAll('.swatch.active')
                        .forEach((s) => s.classList.remove('active'));
                    custom.classList.add('active');
                    color = custom.value;
                    colorBtn.style.background = custom.value;
                    closePalette();
                });
            }

            function pickColor(c, el) {
                color = c;
                colorsEl.querySelectorAll('.swatch.active')
                    .forEach((s) => s.classList.remove('active'));
                if (el) el.classList.add('active');
                colorBtn.style.background = c;
                closePalette();
            }

            function openPalette() {
                if (galleryOpen) closeGallery();
                paletteOpen = true;
                palettePopup.classList.add('open');
                paletteOverlay.classList.add('open');
            }

            function closePalette() {
                paletteOpen = false;
                palettePopup.classList.remove('open');
                paletteOverlay.classList.remove('open');
            }

            const togglePalette = () => (paletteOpen ? closePalette() : openPalette());

            /* ================= Gallery ================= */
            function buildGallery() {
                const frag = document.createDocumentFragment();
                for (let i = 1; i <= GALLERY_COUNT; i++) {
                    const img = document.createElement('img');
                    img.src = 'img/' + i + '.jpg';
                    img.loading = 'lazy';
                    img.decoding = 'async';
                    img.alt = 'Coloring page ' + i;
                    frag.appendChild(img);
                }
                galleryEl.appendChild(frag);

                galleryEl.addEventListener('click', (e) => {
                    const img = e.target.closest('img');
                    if (!img) return;
                    selectImage(img);
                });
            }

            function selectImage(img) {
                galleryEl.querySelectorAll('img.active')
                    .forEach((i) => i.classList.remove('active'));
                img.classList.add('active');
                loadImage(img.currentSrc || img.src);
                closeGallery();
            }

            function openGallery() {
                if (paletteOpen) closePalette();
                galleryOpen = true;
                galleryEl.classList.add('open');
                document.body.classList.add('gallery-open');
                fitCanvasToContainer();
            }

            function closeGallery() {
                galleryOpen = false;
                galleryEl.classList.remove('open');
                document.body.classList.remove('gallery-open');
                fitCanvasToContainer();
            }

            const toggleGallery = () => (galleryOpen ? closeGallery() : openGallery());

            /* ================= Toolbar (event delegation) ================= */
            document.querySelector('.toolbar').addEventListener('click', (e) => {
                const btn = e.target.closest('[data-action]');
                if (!btn) return;
                switch (btn.dataset.action) {
                    case 'gallery': toggleGallery(); break;
                    case 'pen': setTool('pen'); break;
                    case 'bucket': setTool('bucket'); break;
                    case 'undo': undo(); break;
                    case 'clear': clearCanvas(); break;
                    case 'save': download(); break;
                }
            });

            colorBtn.addEventListener('click', togglePalette);
            paletteOverlay.addEventListener('click', closePalette);

            /* ================= Global dismissal ================= */
            document.addEventListener('pointerdown', (e) => {
                const t = e.target;
                if (!(t instanceof Element)) return;

                if (paletteOpen &&
                    !t.closest('#palettePopup') &&
                    !t.closest('#colorBtn')) {
                    closePalette();
                }

                if (galleryOpen &&
                    !t.closest('#gallery') &&
                    !t.closest('#galleryBtn')) {
                    closeGallery();
                }
            }, true);

            /* ================= Keyboard shortcuts ================= */
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') {
                    e.preventDefault();
                    undo();
                }
            });

            /* ================= Splash ================= */
            const splash = document.getElementById('splash');
            splash.addEventListener('animationend', () => splash.remove());
            setTimeout(() => splash.remove(), 4000); // safety net

            /* ================= PWA ================= */
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('sw.js')
                        .catch((err) => console.warn('SW registration failed:', err));
                });
            }

            let deferredPrompt = null;
            let promptShown = false;
            try { promptShown = !!localStorage.getItem('installPromptShown'); } catch (_) { }

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                if (promptShown) return;
                showInstallButton();
                try { localStorage.setItem('installPromptShown', 'yes'); } catch (_) { }
            });

            function showInstallButton() {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.textContent = '📲 Install App';
                btn.className = 'install-banner';
                document.body.appendChild(btn);
                requestAnimationFrame(() => btn.classList.add('show'));

                btn.addEventListener('click', () => {
                    btn.remove();
                    if (!deferredPrompt) return;
                    deferredPrompt.prompt();
                    deferredPrompt.userChoice.finally(() => { deferredPrompt = null; });
                });
            }

            /* ================= Init ================= */
            function init() {
                buildPalette();
                buildGallery();
                setTool('pen');

                // white starting canvas so bucket fill works immediately
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                fitCanvasToContainer();
            }

            init();
        })();
    </script>
</body>

</html>
