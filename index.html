<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>🎨 Coloring App Pro</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #eef2f7;
        }

        .toolbar {
            margin: 10px;
        }

        button,
        input {
            padding: 8px;
            margin: 5px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        canvas {
            border: 2px solid #333;
            background: white;
            touch-action: none;
        }

        .gallery {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .gallery img {
            width: 100px;
            height: 80px;
            object-fit: contain;
            margin: 8px;
            cursor: pointer;
            border-radius: 6px;
            border: 2px solid transparent;
            background: #fff;
        }

        .gallery img:hover {
            border: 2px solid #007bff;
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <h2>🎨 Coloring App Pro</h2>

    <div class="toolbar">
        <input type="color" id="colorPicker">
        <button onclick="setTool('pen')">🖌 Pen</button>
        <button onclick="setTool('bucket')">🪣 Fill</button>
        <button onclick="undo()">↩ Undo</button>
        <button onclick="clearCanvas()">🧹 Clear</button>
        <button onclick="download()">⬇ Download</button>
    </div>

    <canvas id="canvas" width="600" height="450"></canvas>

    <h3>📸 Choose Image</h3>
    <div class="gallery">
        <img src="img/part.jpg" onclick="loadImage(this.src)">
        <img src="img/bird.jpg" onclick="loadImage(this.src)">
        <img src="img/tiger.jpg" onclick="loadImage(this.src)">
        <img src="img/butterfly.jpg" onclick=" loadImage(this.src)">
        <img src="img/lion.jpg" onclick=" loadImage(this.src)">
        <img src="img/1.jpg" onclick=" loadImage(this.src)">
    </div>

    <script>
        const canvas = document.getElementById("canvas");
        const ctx = canvas.getContext("2d", { willReadFrequently: true });

        let painting = false;
        let tool = "pen";
        let color = "#000000";
        let history = [];
        const MAX_HISTORY = 15;

        // Color picker
        document.getElementById("colorPicker").oninput = e => color = e.target.value;

        // Tool
        function setTool(t) {
            tool = t;
        }

        // Save state (optimized)
        function saveState() {
            if (history.length >= MAX_HISTORY) history.shift();
            history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
        }

        // Undo
        function undo() {
            if (history.length) ctx.putImageData(history.pop(), 0, 0);
        }

        // Pointer position
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
            const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
            return { x, y };
        }

        // Drawing
        function start(e) {
            if (tool !== "pen") return;

            painting = true;
            ctx.beginPath();

            const { x, y } = getPos(e);
            ctx.moveTo(x, y);

            saveState();
        }

        function draw(e) {
            if (!painting || tool !== "pen") return;

            const { x, y } = getPos(e);

            ctx.lineWidth = 4;
            ctx.lineCap = "round";
            ctx.strokeStyle = color;

            ctx.lineTo(x, y);
            ctx.stroke();
        }

        function end() {
            painting = false;
            ctx.beginPath();
        }

        // 🚀 FAST BUCKET (mousedown instead of click)
        canvas.addEventListener("mousedown", (e) => {
            if (tool !== "bucket") return;

            saveState();

            const { x, y } = getPos(e);
            floodFillFast(Math.floor(x), Math.floor(y), hexToRgb(color));
        });

        // 🔥 Optimized Flood Fill
        function floodFillFast(x, y, fillColor) {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;
            const width = canvas.width;
            const height = canvas.height;

            const visited = new Uint8Array(width * height);

            const index = (y * width + x) * 4;
            const targetColor = [data[index], data[index + 1], data[index + 2]];

            // Exit if same color
            if (
                targetColor[0] === fillColor[0] &&
                targetColor[1] === fillColor[1] &&
                targetColor[2] === fillColor[2]
            ) return;

            const stack = [[x, y]];

            while (stack.length) {
                const [cx, cy] = stack.pop();
                const pos = cy * width + cx;

                if (cx < 0 || cy < 0 || cx >= width || cy >= height) continue;
                if (visited[pos]) continue;

                visited[pos] = 1;

                const i = pos * 4;
                const r = data[i], g = data[i + 1], b = data[i + 2];

                // Border stop
                if (r < 60 && g < 60 && b < 60) continue;

                // Color match
                if (
                    Math.abs(r - targetColor[0]) > 40 ||
                    Math.abs(g - targetColor[1]) > 40 ||
                    Math.abs(b - targetColor[2]) > 40
                ) continue;

                // Fill
                data[i] = fillColor[0];
                data[i + 1] = fillColor[1];
                data[i + 2] = fillColor[2];

                stack.push([cx + 1, cy]);
                stack.push([cx - 1, cy]);
                stack.push([cx, cy + 1]);
                stack.push([cx, cy - 1]);
            }

            ctx.putImageData(imgData, 0, 0);
        }

        // Convert HEX
        function hexToRgb(hex) {
            const num = parseInt(hex.slice(1), 16);
            return [(num >> 16) & 255, (num >> 8) & 255, num & 255];
        }

        // Load image (optimized)
        function loadImage(src) {
            const img = new Image();
            img.src = src;

            img.onload = () => {
                clearCanvas();

                // Fit image to canvas
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                // Clean only once
                cleanImageFast();
            };
        }

        // Faster clean
        function cleanImageFast() {
            const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imgData.data;

            for (let i = 0; i < data.length; i += 4) {
                const avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
                const val = avg < 150 ? 0 : 255;

                data[i] = data[i + 1] = data[i + 2] = val;
            }

            ctx.putImageData(imgData, 0, 0);
        }

        // Clear
        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // Download
        function download() {
            const link = document.createElement("a");
            link.download = "drawing.png";
            link.href = canvas.toDataURL();
            link.click();
        }

        // Events
        canvas.addEventListener("mousedown", start);
        canvas.addEventListener("mousemove", draw);
        canvas.addEventListener("mouseup", end);
        canvas.addEventListener("mouseleave", end);

        canvas.addEventListener("touchstart", e => { e.preventDefault(); start(e); });
        canvas.addEventListener("touchmove", e => { e.preventDefault(); draw(e); });
        canvas.addEventListener("touchend", end);
    </script>

</body>

</html>
